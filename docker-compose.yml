version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    volumes:
      - ./qdrant:/qdrant/storage
    networks:
      - chatbot

  backend:
    build: ./backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.45}
      - TOP_K=${TOP_K:-5}
    volumes:
      - ./documents:/app/documents:ro
    depends_on:
      - qdrant
    networks:
      - chatbot

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chatbot

networks:
  chatbot:
    driver: bridge
